<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — mines.livive.net</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0a0a14; --fg: #e9e9f2; --muted: #9a9ab0; --card: #14141f;
    --border: #26263a; --accent: #7aa2ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  .code { font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 8px 0 12px; font-size: clamp(1.8rem, 4.5vw, 2.6rem); letter-spacing: -.02em; }
  p { margin: 0 0 8px; color: var(--muted); max-width: 55ch; }
  .links { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 26px; font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .home {
    display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--fg); box-shadow: var(--shadow);
  }
  .home:hover { text-decoration: none; border-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404 — Not found</div>
    <h1>This cell is empty.</h1>
    <p>The page you clicked didn&rsquo;t reveal anything. It may have been renamed, moved, or never existed.</p>
    <div class="links">
      <a class="home" href="/">&larr; Back to the cabinet</a>
      <a href="https://www.livive.net/" target="_blank" rel="noopener noreferrer">More Livive projects &rarr;</a>
    </div>
  </div>
</body>
</html>
