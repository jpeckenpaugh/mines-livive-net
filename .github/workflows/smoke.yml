name: smoke

# Lightweight uptime + asset smoke for the live GitHub Pages site at
# https://mines.livive.net/. Complements the Pages build by asserting, from
# outside, that the custom domain serves the committed app over HTTPS:
#   * the root returns 200 and is byte-identical to the committed index.html
#     (not the README), over the `main` `/` legacy Pages source;
#   * models/manifest.json parses as the v2 library (version 2, exactly 9
#     unique checkpoints) and every checkpoint `file` is 200;
#   * the full ES module graph + stylesheet resolve with no 404s;
#   * the onnxruntime-web runtime is reachable on its pinned CDN;
#   * unknown paths return 404 (with the custom 404.html body).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/smoke.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://mines.livive.net
      ORT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v4

      - name: Probe live endpoints
        run: |
          set -euo pipefail
          check() {
            local url="$1" expect="${2:-200}" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 3 --retry-delay 2 "$url")"
            printf '%s  %s\n' "$code" "$url"
            if [ "$code" != "$expect" ]; then
              echo "::error::expected HTTP $expect for $url, got $code"
              exit 1
            fi
          }

          check "$SITE/"
          check "$SITE/index.html"
          check "$SITE/robots.txt"
          check "$SITE/sitemap.xml"

          # Model manifest (Prototype). Each checkpoint `file` is verified in
          # the v2 manifest step below.
          check "$SITE/models/manifest.json"

          # ES module graph + stylesheet (Frontend).
          check "$SITE/src/app.js"
          check "$SITE/src/engine.js"
          check "$SITE/src/ui.js"
          check "$SITE/src/contract.js"
          check "$SITE/src/style.css"
          check "$SITE/src/featurize.js"
          check "$SITE/src/policy.js"
          check "$SITE/src/stub/featurize.js"
          check "$SITE/src/stub/policy.js"

          # onnxruntime-web runtime (pinned CDN, single-threaded WASM).
          check "https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.wasm.min.mjs"
          check "https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort-wasm-simd-threaded.wasm"

      - name: Assert manifest is v2 and every checkpoint file is 200
        run: |
          set -euo pipefail
          curl -sS -L --retry 3 --retry-delay 2 "$SITE/models/manifest.json" \
            -o "$RUNNER_TEMP/manifest.json"
          # Parse the live manifest and emit each checkpoint `file` on stdout.
          # Any schema regression (wrong version, wrong count, duplicate ids,
          # missing/off-`models/` paths) exits non-zero and fails the job.
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY' > "$RUNNER_TEMP/checkpoints.txt"
          import json
          import sys

          with open(sys.argv[1]) as fh:
              manifest = json.load(fh)

          version = manifest.get("version")
          if version != 2:
              sys.exit(f"expected manifest version 2, got {version!r}")

          checkpoints = manifest.get("checkpoints") or []
          if len(checkpoints) != 9:
              sys.exit(f"expected exactly 9 checkpoints, got {len(checkpoints)}")

          ids = [c.get("id") for c in checkpoints]
          if len(set(ids)) != len(ids):
              sys.exit(f"duplicate checkpoint ids: {ids}")

          files = []
          for c in checkpoints:
              path = c.get("file")
              if not path:
                  sys.exit(f"checkpoint {c.get('id')!r} has no file")
              if not path.startswith("models/"):
                  sys.exit(f"unexpected checkpoint path: {path!r}")
              files.append(path)

          sys.stderr.write(
              f"manifest v2: version={version} checkpoints={len(checkpoints)} "
              f"ids={','.join(str(i) for i in ids)}\n"
          )
          print("\n".join(files))
          PY

          while read -r file; do
            [ -n "$file" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 3 --retry-delay 2 "$SITE/$file")"
            printf '%s  %s\n' "$code" "$SITE/$file"
            if [ "$code" != "200" ]; then
              echo "::error::expected HTTP 200 for $SITE/$file, got $code"
              exit 1
            fi
          done < "$RUNNER_TEMP/checkpoints.txt"

          ctype="$(curl -sS -o /dev/null -w '%{content_type}' -L "$SITE/models/policy-m2.onnx")"
          echo "policy-m2.onnx content-type: $ctype"
          case "$ctype" in
            application/octet-stream*|application/onnx*|binary/octet-stream*) ;;
            *) echo "::warning::unexpected ONNX content-type: $ctype" ;;
          esac

      - name: Assert unknown paths 404 with the custom 404.html body
        run: |
          set -euo pipefail
          # GitHub Pages serves the custom 404 document with a 404 status for
          # unknown paths (a direct request to /404.html also returns 404).
          code="$(curl -sS -o "$RUNNER_TEMP/live-404.html" -w '%{http_code}' -L --retry 3 "$SITE/definitely-not-a-real-page-$RANDOM")"
          echo "$code  <unknown path>"
          if [ "$code" != "404" ]; then
            echo "::error::expected HTTP 404 for an unknown path, got $code"
            exit 1
          fi
          grep -q "This cell is empty" "$RUNNER_TEMP/live-404.html" || {
            echo "::error::unknown path did not serve the custom 404.html body"
            exit 1
          }

      - name: Assert root serves the committed index.html (not the README)
        run: |
          set -euo pipefail
          curl -sS -L --retry 3 "$SITE/" -o "$RUNNER_TEMP/live-index.html"
          if ! diff -q index.html "$RUNNER_TEMP/live-index.html" >/dev/null; then
            echo "::error::https://mines.livive.net/ does not match the committed index.html"
            diff -u index.html "$RUNNER_TEMP/live-index.html" || true
            exit 1
          fi
          echo "root matches committed index.html ($(wc -c < index.html) bytes)"
